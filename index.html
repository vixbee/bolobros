<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Bolo Bros — Plataformero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
html,body{margin:0;height:100%;background:#111;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
#wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
canvas{width:min(100vw,calc((100vh - 30px)*512/480));max-width:960px;aspect-ratio:512/480;image-rendering:pixelated;display:block}
#help{font-size:13px;opacity:.7;margin-top:6px;text-align:center}
#touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;padding:18px;pointer-events:none}
.pad{display:flex;gap:12px;pointer-events:auto}
.btn{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;user-select:none;-webkit-user-select:none}
.btn.on{background:rgba(255,255,255,.5)}
@media (pointer:coarse){#touch{display:flex}#help{display:none}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="help">← → mover · Espacio / ↑ saltar · ↓ entrar a tubería · Shift correr · P pausa · Enter empezar</div>
</div>
<div id="touch">
  <div class="pad"><div class="btn" data-k="left">◀</div><div class="btn" data-k="down">▼</div><div class="btn" data-k="right">▶</div></div>
  <div class="pad"><div class="btn" data-k="run">B</div><div class="btn" data-k="jump">A</div></div>
</div>
<script>
const T=32,VW=16,VH=15,W=200,H=15,FLAGX=190,CASTLEX=194,NSEC=3;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=VW*T;cv.height=VH*T;
const FONT='"Press Start 2P", monospace';

/* ---------- Input ---------- */
const keys={left:false,right:false,jump:false,run:false,down:false};
let jumpPressed=false,paused=false;
const km={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyZ:'jump',ShiftLeft:'run',ShiftRight:'run',KeyX:'run',ArrowDown:'down',KeyS:'down'};
addEventListener('keydown',e=>{
  initAudio();
  const k=km[e.code];
  if(k){if(k==='jump'&&!keys.jump)jumpPressed=true;keys[k]=true;e.preventDefault()}
  if(state==='map'){const n=mapAvail().length;if(e.code==='ArrowRight'||e.code==='KeyD')mapSel=(mapSel+1)%n;if(e.code==='ArrowLeft'||e.code==='KeyA')mapSel=(mapSel+n-1)%n}
  if((state==='map'||state==='title')&&/^Key[A-Z]$/.test(e.code)){codeBuf=(codeBuf+e.code[3]).slice(-4);if(codeBuf==='BOLO'){codeBuf='';unlockAll()}}
  if(e.code==='Enter')startOrRestart();
  if(e.code==='KeyP'&&state==='play'){paused=!paused;if(paused)stopMusic();else if(!celeb)playTrack(bgTrack())}
});
addEventListener('keyup',e=>{const k=km[e.code];if(k)keys[k]=false});
document.querySelectorAll('.btn').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();initAudio();if(state==='map'&&(k==='left'||k==='right')){const n=mapAvail().length;mapSel=(mapSel+(k==='right'?1:n-1))%n;return}if(state!=='play'&&state!=='dying'){startOrRestart();return}
    if(k==='jump'&&!keys.jump)jumpPressed=true;keys[k]=true;b.classList.add('on')};
  const off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,off));
});
cv.addEventListener('pointerdown',e=>{initAudio();if(state==='map'){const r=cv.getBoundingClientRect();mapTap((e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height);return}startOrRestart()});

/* ---------- Audio ---------- */
let ac=null;
function initAudio(){
  try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();else if(ac.state==='suspended')ac.resume()}catch(e){}
}
function tone(f,d,type='square',v=.07,f2){
  if(!ac)return;
  try{const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);
  g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);
  o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d)}catch(e){}
}
const seq=(notes,gap,d=.12)=>notes.forEach((f,i)=>setTimeout(()=>tone(f,d),i*gap));
const sfx={
  jump:()=>tone(280,.18,'square',.05,640),
  coin:()=>{tone(988,.07);setTimeout(()=>tone(1319,.22),70)},
  stomp:()=>tone(220,.12,'square',.08,70),
  bump:()=>tone(110,.1,'triangle',.18),
  brk:()=>tone(160,.18,'sawtooth',.08,40),
  power:()=>seq([523,659,784,1047,1319],60,.09),
  appear:()=>seq([392,523,659],60,.08),
  shark:()=>tone(70,.26,'sawtooth',.09,115),
  sleep:()=>tone(620,.6,'sine',.07,180),
  swim:()=>tone(520,.08,'sine',.04,820),
  fire:()=>tone(180,.22,'sawtooth',.04,520),
  pipe:()=>{tone(400,.12,'square',.06,120);setTimeout(()=>tone(400,.12,'square',.06,120),160);setTimeout(()=>tone(400,.12,'square',.06,120),320)},
  secret:()=>seq([659,784,988,1319,1568],90,.14),
  treasure:()=>seq([523,659,784,1047,1319,1568,2093,1568,2093],90,.16),
  hurt:()=>tone(500,.4,'sawtooth',.05,120),
  die:()=>seq([494,440,392,330,262,196],140,.16),
  flag:()=>tone(300,.8,'square',.05,1200),
  win:()=>seq([523,659,784,1047,784,1047,1319],130,.14)
};

/* ---------- Música de victoria (original, estilo synth-pop 80s) ---------- */
let noiseBuf=null,musicTimer=null,musicStep=0,musicNext=0;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function getNoise(){if(!noiseBuf){noiseBuf=ac.createBuffer(1,ac.sampleRate*.3,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return noiseBuf}
function note(m,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=mtof(m);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)}
function drum(t,kind){
  if(kind==='k'){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);
    g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.16);return}
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=getNoise();
  f.type=kind==='s'?'bandpass':'highpass';f.frequency.value=kind==='s'?1800:7000;
  const d=kind==='s'?.16:.04;g.gain.setValueAtTime(kind==='s'?.22:.06,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t);s.stop(t+d+.02);
}
// Melodía en corcheas (0 = silencio), 8 compases
const MEL=[72,0,76,79,81,79,76,74, 74,0,71,74,79,0,78,79, 81,0,79,76,72,76,79,84, 81,79,77,76,77,0,0,0,
           72,72,76,79,84,0,83,84, 86,0,83,79,74,0,79,0, 81,84,83,81,79,76,79,81, 77,0,81,0,79,79,83,0];
const CH={C:[60,64,67],G:[59,62,67],A:[57,60,64],F:[57,60,65]},ROOT={C:36,G:31,A:33,F:29};
const PROG=['C','G','A','F','C','G','A','F'];
const BPM=138,S16=60/BPM/4;
function scheduleStep(i,t){
  const bar=Math.floor(i/16)%8,s=i%16;
  let ch=PROG[bar];if(bar===7&&s>=8)ch='G';
  if(s%2===0){const m=MEL[(bar*8+s/2)];if(m)note(m,t,S16*1.8,'square',.06);
    note(ROOT[ch]+(s%4===2?12:0),t,S16*1.6,'sawtooth',.07)}
  note(CH[ch][s%3]+12,t,S16*.9,'triangle',.035);
  if(s%8===0)drum(t,'k');if(s%8===4)drum(t,'s');if(s%2===0)drum(t,'h');
  if(s===14&&bar%2)drum(t,'k');
}
/* Tema del nivel 1-1: original, shuffle alegre (swing en tresillos) */
const LBPM=150,LBEAT=60/LBPM;
const LMEL=[
 67,0,72,0,71,72,76,0,  74,72,69,0,64,0,69,71,  72,0,77,0,76,74,72,0,  74,0,0,71,67,0,62,63,
 64,67,72,67,76,0,74,72, 71,0,68,71,76,0,74,0,  72,69,65,69,72,0,68,0,  67,0,71,74,77,76,74,71,
 77,0,76,77,81,0,77,0,  76,0,72,0,67,0,72,76,  74,0,77,0,81,79,77,74,  79,0,0,0,71,74,77,79,
 81,79,77,0,76,77,79,0, 80,0,76,0,81,0,72,0,  74,78,81,0,79,78,74,0,  74,0,71,0,67,0,62,63];
const LC={C:[60,64,67],Am:[57,60,64],F:[57,60,65],G:[55,59,62],E7:[56,59,62,64],Fm:[56,60,65],G7:[55,59,62,65],Dm7:[57,60,62,65],D7:[54,57,60,62]};
const LR={C:36,Am:33,F:29,G:31,E7:28,Fm:29,G7:31,Dm7:26,D7:26};
// acorde por medio compás
const LPROG=['C','C','Am','Am','F','F','G','G', 'C','C','E7','E7','F','Fm','G7','G7',
             'F','F','C','C','Dm7','Dm7','G7','G7', 'F','F','E7','Am','D7','D7','G7','G7'];
function levelStep(i,t){
  const bar=Math.floor(i/12)%16,s=i%12,beat=Math.floor(s/3),sub=s%3;
  if(sub===1)return;
  const e=beat*2+(sub?1:0),ch=LPROG[bar*2+(beat>1?1:0)];
  const m=LMEL[bar*8+e];if(m)note(m,t,LBEAT*.55,'square',.045);
  if(sub===0){note(LR[ch]+[0,7,12,7][beat],t,LBEAT*.8,'triangle',.16);
    drum(t,beat%2?'s':'k');drum(t,'h')}
  else{LC[ch].forEach(n=>note(n,t,LBEAT*.18,'square',.012));drum(t,'h')}
}
/* Tema de los cuartos secretos: arpegios misteriosos */
const SDT=60/108/2,SPROG=[[57,60,64],[53,57,60],[50,53,57],[52,56,59]];
function secretStep(i,t){
  const bar=Math.floor(i/8)%4,s=i%8,c=SPROG[bar];
  note([c[0],c[1],c[2],c[0]+12,c[2]+12,c[0]+12,c[2],c[1]][s]+12,t,SDT*1.6,'triangle',.07);
  if(s===0)note(c[0]-12,t,SDT*7,'square',.025);
  if(s===6&&bar%2)note(c[2]+24,t,SDT*2,'sine',.05);
  if(s%4===0)drum(t,'h');
}
const TRACKS={victory:{dt:S16,step:scheduleStep},level:{dt:LBEAT/3,step:levelStep},secret:{dt:SDT,step:secretStep}};
const ST8=60/180/2,STMEL=[72,72,72,0,67,0,72,0, 70,70,70,0,65,0,70,74, 72,72,72,0,79,0,77,76, 74,0,70,0,74,0,77,79];
function starStep(i,t){const bar=Math.floor(i/8)%4,s=i%8,m=STMEL[bar*8+s];if(m)note(m,t,ST8*.8,'square',.05);
  note((bar%2?34:36)+(s%2?12:0),t,ST8*.7,'triangle',.16);if(s%2===0)drum(t,s%4===0?'k':'s');drum(t,'h')}
TRACKS.star={dt:ST8,step:starStep};
function mk(bpm,mel,bass,dr,mv=.045,mt='square'){const dt=60/bpm/2,bars=mel.length/8;
  return {dt,step:(i,t)=>{const bar=Math.floor(i/8)%bars,s=i%8,m=mel[bar*8+s];if(m)note(m,t,dt*.85,mt,mv);const b=bass(bar,s);if(b)note(b,t,dt*.8,'triangle',.15);dr(s,t,bar)}}}
// 1-3: noche aventurera en La menor
TRACKS.night=mk(140,[69,0,72,0,76,0,74,72, 71,0,69,0,64,0,67,69, 72,0,74,72,69,0,65,0, 67,0,71,74,79,0,77,74,
  76,0,0,74,72,0,74,76, 81,0,79,76,74,72,71,69, 72,0,69,0,65,69,72,77, 76,0,75,0,76,0,71,68],
  (bar,s)=>[33,33,29,31,33,33,29,28][bar]+[0,12,0,12,7,12,0,7][s],
  (s,t)=>{if(s%4===0)drum(t,'k');if(s%4===2)drum(t,'s');drum(t,'h')});
// Jefe: tenso y rápido
TRACKS.boss=mk(172,[76,0,76,77,76,0,71,0, 76,0,79,0,77,76,74,71, 79,0,79,80,79,0,74,0, 74,0,72,71,70,71,72,74],
  (bar,s)=>[40,41,40,41,40,43,40,46][s]+[0,0,3,-2][bar],
  (s,t)=>{if(s%2===0)drum(t,'k');if(s%4===2)drum(t,'s');drum(t,'h')},.05);
// 0-1: bonus feliz con arpegios
TRACKS.bonus=mk(168,[72,76,79,84,79,76,72,76, 72,77,81,84,81,77,72,77, 71,74,79,83,79,74,71,74, 72,76,79,84,88,84,79,76],
  (bar,s)=>s%2?0:[36,41,43,36][bar]+(s%4?12:0),
  (s,t)=>{if(s===0||s===4)drum(t,'k');if(s===2||s===6)drum(t,'s');if(s%2)drum(t,'h');if(s===6)note(96,t,.1,'sine',.03)},.035);
const DMEL=[64,65,68,69,71,0,69,68, 69,68,65,64,65,0,64,0, 71,72,71,69,68,0,69,71, 72,0,71,69,68,65,64,0,
  76,0,77,76,74,72,71,0, 72,71,69,68,69,0,0,0, 68,69,71,72,74,72,71,69, 68,0,65,0,64,0,0,0];
const DBASS=(bar,s)=>[40,40,41,40,45,45,41,40][bar]+[0,0,12,0,7,0,12,0][s];
// Mundo 2: desierto (escala frigia dominante)
TRACKS.desert=mk(132,DMEL,DBASS,(s,t)=>{if(s===0||s===3||s===4)drum(t,'k');if(s===2||s===6)drum(t,'s');if(s%2)drum(t,'h')});
TRACKS.dnight=mk(110,DMEL,DBASS,(s,t)=>{if(s===0||s===3)drum(t,'k');if(s===6)drum(t,'s');if(s%2)drum(t,'h')},.06,'triangle');
// Mundo 3: océano tranquilo
const WMEL=[76,0,79,0,83,0,81,79, 76,0,0,72,74,0,76,0, 77,0,81,0,84,0,83,81, 79,0,0,74,76,0,74,0,
  76,0,79,0,83,0,86,84, 81,0,0,79,76,0,79,0, 77,0,76,74,72,0,74,76, 72,0,0,0,0,0,0,0];
const WBASS=(bar,s)=>[36,33,29,31,36,33,29,31][bar]+[0,0,7,0,12,0,7,0][s];
TRACKS.water=mk(100,WMEL,WBASS,(s,t)=>{if(s%4===2)drum(t,'h')},.06,'triangle');
TRACKS.deep=mk(84,WMEL,WBASS,(s,t)=>{if(s===0)drum(t,'k');if(s%4===2)drum(t,'h')},.05,'sine');
const bgTrack=()=>player&&player.star>0?'star':inRoom?'secret':boss&&!boss.dead?'boss':LVL_TRACK[lvl];
let curTrack=null;
function playTrack(name){
  if(!ac||(curTrack===name&&musicTimer))return;
  stopMusic();curTrack=name;const tr=TRACKS[name];musicStep=0;musicNext=ac.currentTime+.1;
  musicTimer=setInterval(()=>{while(musicNext<ac.currentTime+.15){tr.step(musicStep++,musicNext);musicNext+=tr.dt}},40);
}
function stopMusic(){clearInterval(musicTimer);musicTimer=null;curTrack=null}

/* ---------- Fuegos artificiales ---------- */
let fw=[],celeb=0;
function updateFireworks(){
  if(celeb){celeb++;
    if(Math.random()<.06||celeb%45===1)fw.push({x:60+Math.random()*(cv.width-120),y:cv.height,vx:(Math.random()-.5)*1.5,vy:-8-Math.random()*3.5,rocket:true,hue:Math.random()*360,t:200})}
  const add=[];
  for(const f of fw){
    f.vy+=f.rocket?.12:.05;f.x+=f.vx;f.y+=f.vy;f.t--;
    if(!f.rocket){f.vx*=.98;f.vy*=.98}
    if(f.rocket&&f.vy>-1.2){f.t=0;const n=40+Math.floor(Math.random()*30),sp=2+Math.random()*2.5,two=Math.random()<.4;
      for(let i=0;i<n;i++){const a=i/n*6.283,v=sp*(.6+Math.random()*.4);
        add.push({x:f.x,y:f.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,hue:two&&i%2?(f.hue+150)%360:f.hue,t:60+Math.random()*30,life:90})}
      if(ac)try{const s=ac.createBufferSource(),g=ac.createGain();s.buffer=getNoise();g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.3);s.connect(g);g.connect(ac.destination);s.start()}catch(e){}}
  }
  fw=fw.filter(f=>f.t>0).concat(add);
}
function drawFireworks(){
  for(const f of fw){
    if(f.rocket){ctx.fillStyle='#fff3c0';ctx.fillRect(f.x-1,f.y-1,3,6);continue}
    const a=Math.max(0,f.t/f.life);
    ctx.fillStyle=`hsla(${f.hue},100%,${60+(1-a)*25}%,${a})`;ctx.fillRect(f.x-2,f.y-2,4,4);
  }
}

/* ---------- Level ---------- */
let map,enemies,items,parts,popups,bumps,player,cam,state='title',score=0,coins=0,lives=3,time=300,tick=0,frame=0,flagY,deathT,winT;
let lvl='1-1',introT=0,introSub='',LW=W,inRoom=false,pipes=[],secretPipes=[],found=new Set(),mainSave=null,roomExit=null,treasure=false,banner=null;
let SEC={},boss=null,bossT=0,mapSel=0,clearMsg='';
const BUILT=['1-1','1-2','1-3','0-1','2-1','2-2','2-3','0-2','3-1','3-2','3-3','0-3'];
const NEXT={'1-1':'1-2','1-2':'1-3','1-3':'2-1','0-1':'2-1','2-1':'2-2','2-2':'2-3','2-3':'3-1','0-2':'2-3','3-1':'3-2','3-2':'3-3','0-3':'3-3','3-3':null};
const LVL_TRACK={'1-1':'level','1-2':'level','1-3':'night','0-1':'bonus','2-1':'desert','2-2':'desert','2-3':'dnight','0-2':'bonus','3-1':'water','3-2':'water','3-3':'deep','0-3':'bonus'};
const THEME={'1-1':'day','1-2':'sunset','1-3':'night','0-1':'space','2-1':'desert','2-2':'dsunset','2-3':'dnight','0-2':'gold','3-1':'water','3-2':'water','3-3':'deep','0-3':'water'};
const BOSS={'1-3':'dragon','2-3':'scorpion','3-3':'octopus'};
const CUR={'3-2':[[40,70],[110,140]]};
let water=false;const wet=()=>water&&!inRoom;
const isDes=()=>['desert','dsunset','dnight','gold'].includes(THEME[lvl]);
const MAPNODES=[['1-1',0,0],['1-2',1,0],['1-3',2,0],['0-1',3,0,true],['2-1',0,1],['2-2',1,1],['2-3',2,1],['0-2',3,1,true],['3-1',0,2],['3-2',1,2],['3-3',2,2],['0-3',3,2,true]];
const WORLDNAMES=['MUNDO 1 · PRADERA','MUNDO 2 · DESIERTO','MUNDO 3 · OCÉANO'];
let SAVE={unlocked:['1-1'],sec:{}};
try{const d=JSON.parse(localStorage.getItem('bolobros_save')||'null');if(d&&d.unlocked)SAVE=d}catch(e){}
function persist(){try{localStorage.setItem('bolobros_save',JSON.stringify(SAVE))}catch(e){}}
let codeBuf='',mapMsgT=0,titleTaps=0;
function unlockAll(){BUILT.forEach(unlock);mapMsgT=240;sfx.treasure();if(state==='title')newGame()}
function unlock(l){if(!SAVE.unlocked.includes(l)){SAVE.unlocked.push(l);persist()}}
const solidI=c=>c==='I';
const solid=c=>'#BSsMPUXLR'.includes(c);
function tileAt(tx,ty){if(ty<0||ty>=H)return '.';if(tx<0||tx>=LW)return '#';return map[ty][tx]}

function buildLevel(){
  map=[];pipes=[];for(let y=0;y<H;y++)map.push(new Array(W).fill('.'));
  const set=(x,y,c)=>{if(y>=0&&y<H&&x>=0&&x<W)map[y][x]=c};
  const row=(a,b,y,c)=>{for(let x=a;x<=b;x++)set(x,y,c)};

function buildRoom(n){
  const li=Math.max(0,BUILT.indexOf(lvl)),ph=PHRASES[(li*3+n)%PHRASES.length].toUpperCase();
  let w=0;for(const ch of ph)w+=ch==='!'?2:4;
  const RW=w+14,m=[];for(let y=0;y<H;y++)m.push(new Array(RW).fill('.'));
  const set=(x,y,c)=>{if(y>=0&&y<H&&x>=0&&x<RW)m[y][x]=c};
  const row=(a,b,y,c)=>{for(let x=a;x<=b;x++)set(x,y,c)};
  for(let y=0;y<H;y++){set(0,y,'U');set(RW-1,y,'U')}
  row(0,RW-1,0,'U');row(0,RW-1,1,'U');row(0,RW-1,13,'U');row(0,RW-1,14,'U');

function collideX(o){
  const top=Math.floor(o.y/T),bot=Math.floor((o.y+o.h-1)/T);

  else if(o.vx<0){const tx=Math.floor(o.x/T);for(let ty=top;ty<=bot;ty++)if(solid(tileAt(tx,ty))){o.x=(tx+1)*T;return true}}
  return false;
}

function updateBoss(e){

    if(deathT>170){lives--;if(lives<=0)state='over';else startLevel()}
  }
  for(const q of parts){q.vy+=q.spark?.15:(q.ember||q.bub)?0:.5;if(q.bub)q.x+=Math.sin(q.t/4)*.5;q.x+=q.vx;q.y+=q.vy;q.t--}
  parts=parts.filter(q=>q.t>0);
  updateFireworks();
  for(const b of bumps)b.t--;bumps=bumps.filter(b=>b.t>0);
  for(const u of popups){u.y-=1;u.t--}popups=popups.filter(u=>u.t>0);
  jumpPressed=false;
}

function drawPlayer(){

function drawDragon(e,x,y){

  drawPipeHints();
  drawFlagAndCastle();
  items.forEach(drawItem);
  enemies.forEach(drawEnemy);
  shots.forEach(drawShot);
  if(!inPipe)drawPlayer();
  for(const q of parts){
    if(q.coin){ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.ellipse(q.x+8-cam,q.y,Math.abs(Math.cos(q.t/3))*7+2,10,0,0,7);ctx.fill()}
    else if(q.bub){ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(q.x-cam,q.y,3,0,7);ctx.stroke()}
    else if(q.ember){ctx.globalAlpha=q.t/14;ctx.fillStyle=q.ember[q.t%2?0:2];ctx.fillRect(q.x-cam-2,q.y-2,4,4);ctx.globalAlpha=1}
    else if(q.spark){ctx.fillStyle=q.t%6<3?'#fff3b0':'#ffd23f';ctx.fillRect(q.x-cam,q.y,4,4)}
    else{ctx.fillStyle='#c4572a';ctx.fillRect(q.x-cam,q.y,12,12);ctx.fillStyle='#6e2a10';ctx.fillRect(q.x-cam,q.y,12,2)}
  }
  popups.forEach(u=>text(u.text,u.x-cam,u.y,10));
  drawHUD();
  if(banner&&state==='play')text(banner.text,cv.width/2,100,12,'center',Math.floor(frame/8)%2?'#ffd23f':'#fff');
  if(boss&&!boss.dead&&state==='play'){text(boss.name,cv.width/2,62,9,'center','#ff6b6b');for(let i=0;i<3;i++)drawHeart(cv.width/2-24+i*24,74,7,i<boss.hp?'#e63946':'#444')}
  if(state==='intro'){ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);drawHUD();text(lvl[0]==='0'?'MUNDO SECRETO '+lvl:'MUNDO '+lvl,cv.width/2,200,lvl[0]==='0'?16:24,'center',lvl[0]==='0'?'#ff7ad9':'#ffd23f');text('♥ x '+lives,cv.width/2,250,14,'center','#ff6b8a');text(introSub,cv.width/2,300,10,'center','#8ff0de');drawFireworks();return}
  if(state==='map'){drawMap();return}
  if(state==='clear')overlay([[clearMsg,14,'#ffd23f'],['Puntos: '+score,14],['Monedas: '+coins,12],['¿Ya encontraste todos los secretos ◆?',9,'#ffb866'],['Enter o toca para ir al mapa',10,'#8ff0de']]);
  else if(state==='title')overlay([['BOLO BROS',32,'#ffd23f'],['Una aventura plataformera',10],['Enter o toca para jugar',12,'#8ff0de'],['← → mover · Espacio saltar',9],['Shift correr · pisa a los slimes',9],['↓ sobre una tubería brillante...',9,'#ffd23f'],['¡encuentra los '+NSEC+' secretos!',9,'#ffd23f']]);
  else if(state==='over')overlay([['GAME OVER',28,'#ff6b8a'],['Puntos: '+score,14],['Secretos: '+found.size+'/'+NSEC,11],['Enter o toca para ir al mapa',11,'#8ff0de']]);
  else if(state==='win')overlay([['¡MUNDO 1 COMPLETADO!',18,'#ffd23f'],['Puntos: '+score,14],['Monedas: '+coins,12],['Secretos: '+found.size+'/'+NSEC+(treasure?'  ♥ TESORO':''),11,treasure?'#ffd23f':'#fff'],['Enter o toca para jugar otra vez',10,'#8ff0de']]);
  else if(paused)overlay([['PAUSA',28],['P para continuar',11]]);
  drawFireworks();
}

function drawMap(){
  const g=ctx.createLinearGradient(0,0,0,cv.height);g.addColorStop(0,'#0e1a3a');g.addColorStop(1,'#26345e');ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);
  text('MAPA DE MUNDOS',cv.width/2,40,16,'center','#ffd23f');
  const av=mapAvail(),sel=av[mapSel]&&av[mapSel][0];
  for(let w=0;w<3;w++){const y=110+w*120;
    text(WORLDNAMES[w],40,y-30,9,'left',['#8ff0de','#ffb866','#5ec8f2'][w]);
    ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(80,y+10);ctx.lineTo(80+2*130,y+10);ctx.stroke()}
  for(const [id,cx,wy,secret] of MAPNODES){
    const open=SAVE.unlocked.includes(id),built=BUILT.includes(id);
    if(secret&&!open)continue;
    const x=80+cx*130,y=120+wy*120;
    ctx.fillStyle=secret?'#7b2cbf':open&&built?'#2a9d8f':'#3a3f55';ctx.beginPath();ctx.arc(x,y,24,0,7);ctx.fill();
    if(id===sel){ctx.strokeStyle='#ffd23f';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,30+Math.sin(frame/8)*2,0,7);ctx.stroke()}
    text(open&&built?id:'🔒',x,y+5,open&&built?9:12,'center','#fff');
    if(open&&built&&!secret)text('◆'+(SAVE.sec[id]||0)+'/3',x,y+44,7,'center',(SAVE.sec[id]||0)>=3?'#ffd23f':'#8ff0de');
    if(secret)text('SECRETO',x,y+44,7,'center','#ff7ad9');
    if(!built)text('pronto',x,y+44,7,'center','#999');
  }
  text('← → elegir · Enter / toca para jugar',cv.width/2,cv.height-20,8,'center','#ccc');
  if(mapMsgT>0){mapMsgT--;ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(40,200,cv.width-80,60);text('¡CÓDIGO SECRETO!',cv.width/2,225,12,'center','#ffd23f');text('Todos los niveles desbloqueados',cv.width/2,248,8,'center','#8ff0de')}
}
function mapTap(cx,cy){
  if(cy<60){if(++titleTaps>=5){titleTaps=0;unlockAll()}return}titleTaps=0;
  for(const [id,nx,wy,secret] of MAPNODES){const x=80+nx*130,y=120+wy*120;
    if(Math.hypot(cx-x,cy-y)<34){const i=mapAvail().findIndex(n=>n[0]===id);if(i>=0){mapSel=i;startOrRestart()}}}
}

/* ---------- Loop ---------- */
let last=performance.now(),accum=0;const STEP=1000/60;
function loop(t){
  accum+=Math.min(100,t-last);last=t;
  while(accum>=STEP){step();accum-=STEP}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
